services:
  db:
    image: postgres:16-alpine
    container_name: status-check-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: status_check
    ports:
      # Host 5433 -> container 5432 (host 5432 is often already taken)
      - "5433:5432"
    volumes:
      - status-check-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d status_check"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  status-check-pgdata:
